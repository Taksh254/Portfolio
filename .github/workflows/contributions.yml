name: Refresh contribution heatmap

on:
  schedule:
    - cron: "17 0 * * *" # daily, 05:47 India time
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/contributions.yml"
      - ".github/scripts/update-contributions.mjs"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-contributions.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/githubContributions.json; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/githubContributions.json
          git commit -m "Refresh contribution heatmap"
          git push
