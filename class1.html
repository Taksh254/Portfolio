<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Slot Booking UI — Class 1</title>
  <link rel="stylesheet" href="class1/style.css">
</head>
<body>

  <main class="container">
    <header class="header-section">
      <h1>Schedule &amp; Booking Slots</h1>
      <p>Select an available time slot below to confirm your session.</p>
    </header>

    <!--
      STEP 2: CSS Grid 4-Slot Container
      Desktop: 4 equal columns (minmax(160px, 1fr)) with 16px gap
      Mobile (<=700px): 1 column layout
    -->
    <section aria-label="Available appointment slots">
      <div class="slot-grid" id="slotGrid">
        <!-- Initial static slots -->
        
        <!-- AVAILABLE STATE -->
        <button type="button" id="slot-1" class="slot available" aria-pressed="false" aria-label="09:00 AM, Morning Slot, status: available">
          <div class="slot-header">
            <span class="slot-time">09:00 AM</span>
            <span class="slot-badge">AVAILABLE</span>
          </div>
          <div class="slot-body">
            <div class="slot-title">Morning Slot</div>
            <p class="slot-desc">Click to select this slot</p>
          </div>
        </button>

        <!-- BOOKED STATE -->
        <button type="button" id="slot-2" class="slot booked" aria-disabled="true" aria-label="11:30 AM, Midday Slot, status: booked, not selectable">
          <div class="slot-header">
            <span class="slot-time">11:30 AM</span>
            <span class="slot-badge">BOOKED</span>
          </div>
          <div class="slot-body">
            <div class="slot-title">Midday Slot</div>
            <p class="slot-desc">Already reserved by user</p>
          </div>
        </button>

        <!-- SELECTED STATE -->
        <button type="button" id="slot-3" class="slot selected" aria-pressed="true" aria-label="02:00 PM, Afternoon Slot, status: selected">
          <div class="slot-header">
            <span class="slot-time">02:00 PM</span>
            <span class="slot-badge">SELECTED</span>
          </div>
          <div class="slot-body">
            <div class="slot-title">Afternoon Slot</div>
            <p class="slot-desc">Currently chosen slot</p>
          </div>
        </button>

        <!-- UNAVAILABLE STATE -->
        <button type="button" id="slot-4" class="slot unavailable" aria-disabled="true" aria-label="04:30 PM, Evening Slot, status: unavailable, not selectable">
          <div class="slot-header">
            <span class="slot-time">04:30 PM</span>
            <span class="slot-badge">UNAVAILABLE</span>
          </div>
          <div class="slot-body">
            <div class="slot-title">Evening Slot</div>
            <p class="slot-desc">Not available for booking</p>
          </div>
        </button>
      </div>
    </section>

    <!-- Interactive control & feedback bar -->
    <div class="control-bar">
      <div class="status-info" id="statusMessage">
        Selected: <strong>1</strong> | Available: <strong>1</strong>
      </div>
      <div class="control-buttons">
        <button type="button" class="btn-book" id="bookBtn">Confirm Booking</button>
        <button type="button" class="btn-reset" id="resetBtn">Reset States</button>
      </div>
    </div>
  </main>

  <script src="class1/app.js"></script>
</body>
</html>
